<!DOCTYPE html>
<html lang="ko">
<body>
  <meta charset="UTF-8">
  <script>
    var name = prompt("이름을 입력하세요.");

    // HTML 문서 본문에 렌더링 (태그 포함 가능)
    document.write("<h1>어서오세요</h1>");
    document.write("<b>" + name + "</b>님, 환영합니다!");

    // 개발자 도구 콘솔에 디버깅 정보 기록
    console.log("User Input Value:", name);</script>
</body>
