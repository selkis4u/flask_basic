<!-- templates/book_form.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 등록</title>
</head>
<body>
    <h2>새 도서 등록</h2>
    <!-- POST 방식으로 데이터를 Flask 서버로 전송 -->
    <form action="/books/new" method="POST">
        <div>
            <label>도서 번호(ID):</label>
            <input type="number" name="bookid" required>
        </div>
        <br>
        <div>
            <label>도서명:</label>
            <input type="text" name="bookname" required>
        </div>
        <br>
        <div>
            <label>출판사:</label>
            <input type="text" name="publisher">
        </div>
        <br>
        <div>
            <label>가격 (1,000원 이상):</label>
            <input type="number" name="price" min="1000" placeholder="기본 10000">
        </div>
        <br>
        <button type="submit">등록하기</button>
    </form>
</body>
</html>
