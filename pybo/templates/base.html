<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <!-- pybo CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; }
    .pulse-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background-color: #198754; box-shadow: 0 0 0 rgba(25, 135, 84, 0.5);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(25, 135, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">
{% include "navbar.html" %}

  <!-- 본문 영역: 자식 템플릿들이 채우는 곳 -->
  <main class="flex-grow-1">
    {% block content %}
    {% endblock %}

  </main>

  <!-- 공통 풋터 -->
  <footer class="bg-white border-top py-4 mt-auto">
    <div class="container px-lg-5 d-flex flex-column flex-md-row align-items-center justify-content-between gap-3 text-secondary small">
      <div class="d-flex align-items-center gap-2">
        <span class="rounded-circle bg-primary d-inline-block" style="width: 8px; height: 8px;"></span>
        <span class="fw-bold text-dark">SelfShop AI agent Platform</span>
        <span>— Multimodal Autonomous Retail AI Project</span>
      </div>
      <div>
        © 2026 SelfShop AI agent. All rights reserved.
      </div>
    </div>
  </footer>
  <script src="{{ url_for('static', filename='jquery-3.7.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
  {% block script %}
  {% endblock %}
</body>
</html>
